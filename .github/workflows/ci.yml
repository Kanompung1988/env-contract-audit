name: Validate Agent Skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit.py examples/drift --format json --fail-on none > /tmp/env-drift.json
      - run: python -c 'import json; d=json.load(open("/tmp/env-drift.json")); assert any(x["rule"]=="ENV003" for x in d["findings"])'
